<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionCare - Secure Digital Report Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-gradient: radial-gradient(circle at 50% 0%, #0c1428 0%, #050811 100%);
    --card-bg: rgba(13, 20, 38, 0.6);
    --border: rgba(59, 130, 246, 0.15);
    --border-strong: rgba(16, 185, 129, 0.3);
    --accent-green: #10b981;
    --accent-blue: #3b82f6;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #475569;
    --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    background: var(--bg-gradient);
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
    overflow-x: hidden;
    position: relative;
  }

  /* Decorative Orbs */
  body::before, body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    z-index: 0;
    pointer-events: none;
    filter: blur(120px);
    opacity: 0.45;
  }
  body::before {
    width: 300px;
    height: 300px;
    top: 10%;
    left: 10%;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 80%);
  }
  body::after {
    width: 250px;
    height: 250px;
    bottom: 10%;
    right: 10%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 80%);
  }

  .container {
    width: 100%;
    max-width: 480px;
    z-index: 10;
    animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes slideUp {
    0% { opacity: 0; transform: translateY(24px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .verify-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 36px 28px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .verify-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--accent-green), var(--accent-blue));
  }

  .status-badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
  }

  .icon-wrap {
    width: 80px;
    height: 80px;
    background: rgba(16, 185, 129, 0.08);
    border: 2px solid var(--accent-green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 0 25px rgba(16, 185, 129, 0.2);
    position: relative;
  }

  /* Pulse animation */
  .icon-wrap::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1px solid rgba(16, 185, 129, 0.3);
    animation: ringPulse 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
  }

  @keyframes ringPulse {
    0% { transform: scale(0.95); opacity: 1; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  .icon-wrap svg {
    width: 38px;
    height: 38px;
    stroke: var(--accent-green);
    fill: none;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .status-title {
    font-family: 'Outfit', sans-serif;
    font-size: 24px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 6px;
    letter-spacing: -0.3px;
  }

  .status-subtitle {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
    background: rgba(255, 255, 255, 0.04);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .status-subtitle::before {
    content: '';
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--accent-green);
    border-radius: 50%;
  }

  .info-title {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 800;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
    text-align: left;
    padding-left: 4px;
  }

  .info-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-radius: 16px;
    transition: all var(--transition);
  }

  .info-row:hover {
    background: rgba(255, 255, 255, 0.03);
    border-color: rgba(59, 130, 246, 0.2);
  }

  .info-key {
    font-size: 13px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .info-val {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .info-val.mono {
    font-family: 'DM Mono', monospace;
    color: var(--text-primary);
    font-weight: 500;
  }

  .info-val.badge {
    background: rgba(59, 130, 246, 0.1);
    color: #60a5fa;
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 700;
    border: 1px solid rgba(59, 130, 246, 0.2);
  }

  .verify-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--accent-green), #059669);
    border: none;
    border-radius: 14px;
    color: white;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.2s ease;
    box-shadow: 0 10px 20px -10px rgba(16, 185, 129, 0.35);
  }

  .verify-button:hover {
    transform: translateY(-1px);
    box-shadow: 0 15px 25px -8px rgba(16, 185, 129, 0.45);
  }

  .verify-button svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2.5;
  }

  .footer-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 28px;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .footer-brand svg {
    width: 16px;
    height: 16px;
    stroke: var(--text-muted);
    fill: none;
    stroke-width: 2;
  }
</style>
</head>
<body>
<div class="container">
  <div class="verify-card">
    <div class="status-badge">
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 11 11 13 15 9"></polyline></svg>
      </div>
      <div class="status-title">Verified Authentic</div>
      <div class="status-subtitle">VisionCare Secure Digital Certificate</div>
    </div>

    <div class="info-title">Diagnosis & Patient Details</div>
    <div class="info-list">
      <div class="info-row">
        <span class="info-key">Report ID</span>
        <span class="info-val mono" id="val-scan-id">VCA-UNKNOWN</span>
      </div>
      <div class="info-row">
        <span class="info-key">Patient Name</span>
        <span class="info-val" id="val-patient-name">Patient</span>
      </div>
      <div class="info-row">
        <span class="info-key">Clinical Diagnosis</span>
        <span class="info-val badge" id="val-diagnosis">UNKNOWN</span>
      </div>
      <div class="info-row">
        <span class="info-key">AI System Confidence</span>
        <span class="info-val mono" id="val-confidence" style="color: var(--accent-green); font-weight: 700;">0.0%</span>
      </div>
      <div class="info-row">
        <span class="info-key">Scan Timestamp</span>
        <span class="info-val mono" id="val-timestamp">—</span>
      </div>
    </div>

    <a href="/" class="verify-button">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      Return to Dashboard
    </a>
  </div>
  
  <div class="footer-brand">
    <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    <span>Cryptographic Report Validation Protected</span>
  </div>
</div>

<script>
  function getParams() {
    try {
      const params = new URLSearchParams(window.location.search);
      return {
        scan_id: params.get('scan_id') || 'UNKNOWN',
        patient_name: params.get('patient_name') || 'Anonymous',
        label: params.get('label') || 'UNKNOWN',
        confidence: params.get('confidence') || '0.0',
        timestamp: params.get('timestamp') || '—'
      };
    } catch (e) {
      console.error("Error parsing URL parameters:", e);
      return {
        scan_id: 'UNKNOWN',
        patient_name: 'Anonymous',
        label: 'UNKNOWN',
        confidence: '0.0',
        timestamp: '—'
      };
    }
  }

  function safeDecode(val) {
    if (!val) return '—';
    try {
      return decodeURIComponent(val);
    } catch (e) {
      try {
        return decodeURI(val);
      } catch (err) {
        return val;
      }
    }
  }

  function setElementText(id, text) {
    const el = document.getElementById(id);
    if (el) {
      el.textContent = text;
    }
  }

  function init() {
    try {
      const data = getParams();
      
      setElementText('val-scan-id', 'VCA-' + (data.scan_id || 'UNKNOWN'));
      setElementText('val-patient-name', safeDecode(data.patient_name));
      
      // Medical term expansion map
      const labelsMap = {
        'CNV': 'Choroidal Neovascularization (CNV)',
        'DME': 'Diabetic Macular Edema (DME)',
        'DRUSEN': 'Drusen (Retinal Deposits)',
        'NORMAL': 'Normal Retina',
        'AMD': 'Age-Related Macular Degeneration (AMD)',
        'CSCR': 'Central Serous Chorioretinopathy (CSCR)',
        'ERM': 'Epiretinal Membrane (ERM)',
        'MH': 'Macular Hole (MH)',
        'RD': 'Retinal Detachment (RD)',
        'GLAUCOMA': 'Glaucoma (Optic Neuropathy)',
        'RP': 'Retinitis Pigmentosa (RP)'
      };
      
      const diagnosisText = labelsMap[data.label] || data.label || 'UNKNOWN';
      setElementText('val-diagnosis', diagnosisText);
      
      // format confidence
      let confVal = parseFloat(data.confidence);
      if (isNaN(confVal)) confVal = 0.0;
      setElementText('val-confidence', confVal.toFixed(1) + '%');
      
      setElementText('val-timestamp', safeDecode(data.timestamp));
    } catch (e) {
      console.error("Error initializing verification page details:", e);
    }
  }

  window.onload = init;
</script>
</body>
</html>
